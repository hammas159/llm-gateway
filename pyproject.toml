[project]
name = "llm-gateway"
version = "0.1.0"
description = "One entry point for every LLM call: routing, budgets, rate limits, fallback, caching, guardrails."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# httpx is the only runtime dependency: it is what the real Ollama / Anthropic /
# HuggingFace providers call out with. Everything else here is stdlib.
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
ui  = ["streamlit>=1.40", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
